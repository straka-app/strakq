async function doConfirm(subId, sessionId) {
  const sub = getSub(subId);

  if (!sub) {
    toast('Subscription not found.', 'warn');
    return;
  }

  const note =
    $('#cfNote')?.value.trim() || null;

  const se =
    (sub.sessions || []).find(
      x =>
        x.id === sessionId ||
        String(x.n) === String(sessionId)
    );

  if (!se) {
    toast(
      'Session could not be found.',
      'warn'
    );
    return;
  }

  if (se.status !== 'checked_in') {
    toast(
      'Only a checked-in session can be completed.',
      'warn'
    );
    return;
  }

  const completedAt =
    new Date().toISOString();

  /*
   * Complete THIS exact session.
   */
  const {
    data: completedSession,
    error: sessErr
  } = await supabaseClient
    .from('sessions')
    .update({
      status: 'completed',

      completed_at:
        completedAt,

      confirmed_by:
        currentUser.id,

      note:
        note || se.notes || null,

      updated_at:
        completedAt
    })
    .eq('id', se.id)
    .eq('subscription_id', subId)
    .eq('status', 'checked_in')
    .select()
    .maybeSingle();

  if (sessErr) {
    console.error(
      'doConfirm session error:',
      sessErr
    );

    toast(
      `Failed to confirm session: ${sessErr.message}`,
      'warn'
    );

    return;
  }

  /*
   * If no row was returned, the session was probably
   * already changed by another action/tab.
   */
  if (!completedSession) {
    toast(
      'This session has already been completed or is no longer pending.',
      'warn'
    );

    await loadAllDashboardData();

    return;
  }

  /*
   * Calculate completed sessions from the actual
   * session records instead of blindly doing:
   *
   * sub.completed + 1
   *
   * This prevents the counter from drifting away
   * from session history.
   */
  const completedSessions =
    (sub.sessions || []).filter(
      s =>
        s.id === se.id ||
        s.status === 'completed'
    ).length;

  /*
   * Better: count the completed rows directly
   * from Supabase so this is authoritative.
   */
  const {
    count,
    error: countErr
  } = await supabaseClient
    .from('sessions')
    .select(
      'id',
      {
        count: 'exact',
        head: true
      }
    )
    .eq('subscription_id', subId)
    .eq('status', 'completed');

  if (countErr) {
    console.error(
      'Completed session count error:',
      countErr
    );

    toast(
      'Session completed, but progress could not be calculated.',
      'warn'
    );

    await loadAllDashboardData();

    return;
  }

  const totalSessions =
    Number(sub.totalSessions || 0);

  const newCompleted =
    Math.min(
      Number(count || 0),
      totalSessions
    );

  const newStatus =
    newCompleted >= totalSessions &&
    totalSessions > 0
      ? 'completed'
      : 'active';

  /*
   * Keep subscription progress synchronized
   * with actual completed session records.
   */
  const {
    error: subErr
  } = await supabaseClient
    .from('subscriptions')
    .update({
      completed_sessions:
        newCompleted,

      status:
        newStatus
    })
    .eq('id', subId);

  if (subErr) {
    console.error(
      'Subscription progress update error:',
      subErr
    );

    toast(
      `Session completed, but progress could not be updated: ${subErr.message}`,
      'warn'
    );

    await loadAllDashboardData();

    return;
  }

  closeModal();

  await loadAllDashboardData();

  const percentage =
    totalSessions
      ? Math.round(
          (newCompleted /
            totalSessions) * 100
        )
      : 0;

  toast(
    `✓ Session #${pad(se.n)} completed. Your subscription is now ${percentage}% complete (${newCompleted}/${totalSessions}).`,
    'ok'
  );

  if (
    newStatus === 'completed'
  ) {
    setTimeout(
      () =>
        toast(
          '🎉 Subscription completed — all sessions delivered!',
          'ok'
        ),
      800
    );
  }
}


async function undoConfirmSession(subId, sessionId){
  const sub = getSub(subId);
  if(!sub){ toast('Subscription not found.', 'warn'); return; }
  const se = (sub.sessions||[]).find(x=>x.id===sessionId);
  if(!se){ toast('Session not found.', 'warn'); return; }
  if(se.status !== 'completed'){
    toast('Only a completed session can be undone.', 'warn');
    return;
  }
  if(!confirm(`Undo confirmation for Session #${pad(se.n)}?\nThis will set it back to 'checked in' and reduce progress by 1.`)) return;

  const { error: sessErr } = await supabaseClient
    .from('sessions')
    .update({
      status: 'checked_in',
      completed_at: null,
      confirmed_by: null,
      updated_at: new Date().toISOString()
    })
    .eq('id', se.id)
    .eq('subscription_id', subId);

  if(sessErr){
    console.error('undoConfirm session error:', sessErr);
    toast(`Failed to undo: ${sessErr.message}`, 'warn');
    return;
  }

  // Recount completed from DB (authoritative)
  const { count, error: countErr } = await supabaseClient
    .from('sessions')
    .select('id', { count: 'exact', head: true })
    .eq('subscription_id', subId)
    .eq('status', 'completed');

  if(countErr){
    console.error('Count error after undo:', countErr);
    await loadAllDashboardData();
    toast('Session undone, but progress recount failed.', 'warn');
    return;
  }

  const newCompleted = Math.max(0, Number(count||0));
  const totalSessions = Number(sub.totalSessions||0);
  const newStatus = newCompleted >= totalSessions && totalSessions>0 ? 'completed' : 'active';

  // Update local cache to prevent flash to zero
  if(!S._lastCompleted) S._lastCompleted = {};
  S._lastCompleted[sub.id] = newCompleted;

  const { error: subErr } = await supabaseClient
    .from('subscriptions')
    .update({
      completed_sessions: newCompleted,
      status: newStatus
    })
    .eq('id', subId);

  if(subErr){
    console.error('Subscription update after undo error:', subErr);
    toast(`Session undone, but subscription update failed: ${subErr.message}`, 'warn');
    await loadAllDashboardData();
    return;
  }

  await logActivity(`Undo confirmed — ${clientName(sub)} · Session #${pad(se.n)} back to checked-in`);
  closeModal();
  await loadAllDashboardData();
  toast(`↩ Session #${pad(se.n)} undone — back to awaiting confirmation (${newCompleted}/${totalSessions})`, 'warn');
}

async function doPause(subId) {
  const sub = getSub(subId);
  if (!sub) {
    toast('Subscription not found.', 'warn');
    return;
  }

  const r = $('#pzReason')?.value.trim();

  const currentNotes = Array.isArray(sub.notes)
    ? sub.notes

  const updatePayload = {

  const { error } = await supabaseClient
    .from('subscriptions')

async function resumeSub(subId) {
  const sub = getSub(subId);

  if (!sub) {
    toast('Subscription not found.', 'warn');
    return;
  }

  let extendedDays = 0;
  let newEndDate = sub.endDate || null;

  // Only extend the end date if one actually exists.
  if (sub.pausedAt && sub.endDate) {
    const pausedAt = new Date(sub.pausedAt);

    if (!Number.isNaN(pausedAt.getTime())) {
      extendedDays = Math.max(
        1,
        Math.ceil((Date.now() - pausedAt.getTime()) / 86400000)
      );

      newEndDate = addDays(sub.endDate, extendedDays);
    }
  }

  const updatePayload = {
    status: 'active',
    end_date: newEndDate,
    paused_at: null
  };

  if (sub.pausedAt) {
    const currentNotes = Array.isArray(sub.notes) ? sub.notes : [];

    const resumeNote = extendedDays > 0
      ? `Resumed — end date extended by ${extendedDays} days to cover the pause.`
      : 'Subscription resumed. No end date was set, so the end date was not changed.';

    updatePayload.notes = [
      ...currentNotes,
      {
        date: todayISO(),
        text: resumeNote
      }
    ];
  }

  const { error } = await supabaseClient
    .from('subscriptions')
    .update(updatePayload)
    .eq('id', subId);

  if (error) {
    console.error('Resume subscription error:', error);
    toast(`Failed to resume subscription: ${error.message}`, 'warn');
    return;
  }

  await loadAllDashboardData();

  if (extendedDays > 0) {
    toast(`Resumed — end date extended ${extendedDays} days.`, 'ok');
  } else {
    toast('Subscription resumed.', 'ok');
  }
}

async function createSub() {
  let clientId = WA.clientId;

  // ----------------------------------------------------------
  // Create new client if necessary
  // ----------------------------------------------------------
  if (WA.newClient) {
    const { data: newClientData, error: clientErr } =
      await supabaseClient
        .from('profiles')
        .insert([{
          full_name: WA.newClient.name,
          phone: WA.newClient.phone,
          role: 'client',
          onboarding_complete: true
        }])
        .select()
        .single();

    if (clientErr) {
      toast('Failed to create client profile', 'warn');
      console.error(clientErr);
      return;
    }

    clientId = newClientData.id;

    const { error: relationErr } =
      await supabaseClient
        .from('instructor_clients')
        .insert({
          instructor_id: currentUser.id,
          client_id: clientId
        });

    if (relationErr) {
      toast('Client created, but connection failed.', 'warn');
      console.error(relationErr);
      return;
    }
  }

  // ----------------------------------------------------------
  // Create subscription
  // ----------------------------------------------------------
  const subPayload = {
    instructor_id: currentUser.id,
    client_id: clientId,
    service_id: WA.serviceId,

    rate: WA.rate,
    billing_type: WA.type,

    total_sessions: WA.sessions,
    completed_sessions: 0,

    start_date: WA.start,
    end_date: WA.end,

    schedule: [...WA.days],
    session_time: WA.time,

    auto_checkin: WA.auto,

    payment_status: WA.pay,

    status: WA.draft ? 'draft' : 'active',

    notes: WA.note
      ? [{ date: todayISO(), text: WA.note }]
      : []
  };

  const {
    data: subData,
    error: subErr
  } = await supabaseClient
    .from('subscriptions')
    .insert([subPayload])
    .select()
    .single();

  if (subErr) {
    toast('Failed to create subscription', 'warn');
    console.error(subErr);
    return;
  }

  // ----------------------------------------------------------
  // Payment records
  // ----------------------------------------------------------
  const total = WA.rate ? WA.rate * WA.sessions : 0;
  const paymentsToInsert = [];

  if (total && WA.pay === 'Paid') {
    paymentsToInsert.push({
      subscription_id: subData.id,
      amount: total,
      method: 'Bank transfer',
      status: 'Paid',
      date: todayISO()
    });

  } else if (total && WA.pay === 'Partial') {

    paymentsToInsert.push({
      subscription_id: subData.id,
      amount: Math.round(total / 2),
      method: 'Bank transfer',
      status: 'Paid',
      date: todayISO()
    });

    paymentsToInsert.push({
      subscription_id: subData.id,
      amount: Math.ceil(total / 2),
      method: 'Pending',
      status: 'Pending',
      date: addDays(todayISO(), 14)
    });

  } else if (total) {

    paymentsToInsert.push({
      subscription_id: subData.id,
      amount: total,
      method: 'Pending',
      status: 'Pending',
      date: WA.start
    });
  }

  if (paymentsToInsert.length) {
    const { error: paymentErr } =
      await supabaseClient
        .from('payments')
        .insert(paymentsToInsert);

    if (paymentErr) {
      console.error('Payment creation error:', paymentErr);
    }
  }

  // ----------------------------------------------------------
  // CREATE SCHEDULED SESSIONS
  // ----------------------------------------------------------
  //
  // Important:
  // We create the scheduled session NOW.
  //
  // Later:
  // scheduled → checked_in → completed
  //
  // Auto-check-in will UPDATE this row rather than creating
  // another session.
  // ----------------------------------------------------------

  const sessionsToInsert = [];

  if (!WA.draft) {

    let sessionCount = 0;

    const currentDate =
      new Date(WA.start + 'T12:00:00');

    const endDate =
      new Date(WA.end + 'T12:00:00');

    while (
      sessionCount < WA.sessions &&
      currentDate <= endDate
    ) {

      const dayName =
        DAY[currentDate.getDay()];

      if (WA.days.has(dayName)) {

        // Build the actual scheduled timestamp.
        const [hours, minutes] =
          (WA.time || '09:00')
            .split(':')
            .map(Number);

        const scheduledDate =
          new Date(currentDate);

        scheduledDate.setHours(
          hours,
          minutes,
          0,
          0
        );

        sessionsToInsert.push({
          subscription_id: subData.id,
          instructor_id: currentUser.id,
          client_id: clientId,

          session_number: sessionCount + 1,

          scheduled_at:
            scheduledDate.toISOString(),

          status: 'scheduled',

          auto_checkin: WA.auto
        });

        sessionCount++;
      }

      currentDate.setDate(
        currentDate.getDate() + 1
      );
    }
  }

  if (sessionsToInsert.length) {

    const {
      error: sessionErr
    } = await supabaseClient
      .from('sessions')
      .insert(sessionsToInsert);

    if (sessionErr) {
      console.error(
        'Session creation error:',
        sessionErr
      );

      toast(
        'Subscription created, but sessions could not be scheduled.',
        'warn'
      );

      closeModal();
      await loadAllDashboardData();
      openDetail(subData.id);
      return;
    }
  }

  closeModal();

  await loadAllDashboardData();

  openDetail(subData.id);

  toast(
    WA.draft
      ? 'Draft saved — activate it whenever the client is ready.'
      : '✓ Subscription created successfully.',
    'ok'
  );
}

async function updateSubscription() {
  const subId = WA.editingSubId;

  if (!subId) {
    toast('Subscription ID is missing.', 'warn');
    return;
  }

  const sub = getSub(subId);

  if (!sub) {
    toast('Subscription not found.', 'warn');
    return;
  }

  /*
   * Read the final values from Step 3.
   */
  const rate =
    $('#wzRate').value
      ? Number($('#wzRate').value)
      : null;

  const type =
    $('#wzType').value;

  const sessions =
    Math.max(
      1,
      Number($('#wzSessions').value || 1)
    );

  const paymentStatus =
    $('#wzPay').value;

  const start =
    $('#wzStart').value;

  const end =
    $('#wzEnd').value || null;

  const time =
    $('#wzTime').value || null;

  const auto =
    $('#wzAuto').checked;

  const note =
    $('#wzNote').value.trim();

  const draft =
    $('#wzDraft').checked;

  const schedule =
    [...WA.days];

  if (!WA.serviceId) {
    toast('Pick a service.', 'warn');
    return;
  }

  if (!start) {
    toast('Start date is required.', 'warn');
    return;
  }

  if (end && end < start) {
    toast('End date must be after the start date.', 'warn');
    return;
  }

  if (!schedule.length) {
    toast('Pick at least one training day.', 'warn');
    return;
  }

  /*
   * Keep existing notes and append the new note.
   */
  const existingNotes =
    Array.isArray(sub.notes)
      ? sub.notes
      : [];

  let notes = existingNotes;

  if (note) {
    notes = [
      ...existingNotes,
      {
        date: todayISO(),
        text: note
      }
    ];
  }

  /*
   * Preserve the current status unless the user
   * is editing a draft and explicitly changes it.
   */
  let newStatus = sub.status;

  if (sub.status === 'draft') {
    newStatus = draft
      ? 'draft'
      : 'active';
  }

  /*
   * Update ONLY columns that actually exist
   * in your subscriptions table.
   */
  const updatePayload = {
    service_id: WA.serviceId,

    rate: rate,

    billing_type: type,

    total_sessions: sessions,

    start_date: start,

    end_date: end,

    schedule: schedule,

    session_time: time,

    auto_checkin: auto,

    payment_status: paymentStatus,

    status: newStatus,

    notes: notes,

    updated_at: new Date().toISOString()
  };

  console.log(
    'Updating subscription:',
    subId,
    updatePayload
  );

  const {
    error
  } = await supabaseClient
    .from('subscriptions')
    .update(updatePayload)
    .eq('id', subId);

  if (error) {
    console.error(
      'Update subscription error:',
      error
    );

    toast(
      `Failed to update assignment: ${error.message}`,
      'warn'
    );

    return;
  }

  /*
   * Update FUTURE scheduled sessions only.
   *
   * Completed and checked-in sessions are left alone.
   */
  const {
    error: sessionError
  } = await updateFutureScheduledSessions(
    sub,
    {
      serviceId: WA.serviceId,
      start,
      end,
      schedule,
      time,
      auto,
      sessions
    }
  );

  if (sessionError) {
    console.error(
      'Future session update error:',
      sessionError
    );

    toast(
      'Assignment saved, but future sessions could not be updated.',
      'warn'
    );
  }

  closeModal();

  await loadAllDashboardData();

  openDetail(subId);

  toast(
    'Assigned service updated successfully.',
    'ok'
  );
}

async function updateFutureScheduledSessions(sub, changes) {
  const today = todayISO();

  /*
   * Get only sessions that have not started yet.
   *
   * We deliberately do NOT modify:
   * - completed sessions
   * - checked-in sessions
   */
  const futureSessions =
    (sub.sessions || []).filter(session => {
      if (session.status !== 'scheduled') {
        return false;
      }

      if (!session.scheduledAt) {
        return false;
      }

      const sessionDate =
        new Date(session.scheduledAt);

      return sessionDate >= new Date(today + 'T00:00:00');
    });

  /*
   * If there are no future sessions,
   * the subscription itself is still updated successfully.
   */
  if (!futureSessions.length) {
    return { error: null };
  }

  const updateResults = [];

  for (const session of futureSessions) {
    const currentDate =
      new Date(session.scheduledAt);

    /*
     * Preserve the original date unless
     * the new start/end window excludes it.
     */
    const dateISO =
      currentDate.toISOString().slice(0, 10);

    const dayName =
      DAY[currentDate.getDay()];

    /*
     * If the existing scheduled date is no longer
     * one of the selected training days, leave it
     * for now rather than deleting session history.
     *
     * The subscription itself is already updated.
     */
    if (!changes.schedule.includes(dayName)) {
      continue;
    }

    const [hours, minutes] =
      (changes.time || '09:00')
        .split(':')
        .map(Number);

    const newScheduled =
      new Date(dateISO + 'T12:00:00');

    newScheduled.setHours(
      hours,
      minutes,
      0,
      0
    );

    /*
     * Respect the new date window.
     */
    if (
      changes.start &&
      dateISO < changes.start
    ) {
      continue;
    }

    if (
      changes.end &&
      dateISO > changes.end
    ) {
      continue;
    }

    const {
      error
    } = await supabaseClient
      .from('sessions')
      .update({
        scheduled_at:
          newScheduled.toISOString(),

        auto_checkin:
          changes.auto,

        updated_at:
          new Date().toISOString()
      })
      .eq('id', session.id)
      .eq('subscription_id', sub.id)
      .eq('status', 'scheduled');

    if (error) {
      updateResults.push(error);
    }
  }

  return {
    error: updateResults.length
      ? updateResults[0]
      : null
  };
}

        <label>Per<select id="svUnit">${['/ session', '/ person', '/ month', '/ block'].map(u => `<option ${s?.unit === u ? 'selected' : ''}>${u}</option>`).join('')}</select></label>

        <label class="pick ${(s?.visibility ?? 'public') === 'public' ? 'on' : ''}"><input type="radio" name="svVis" value="public" ${(s?.visibility ?? 'public') === 'public' ? 'checked' : ''}><b>● Public</b><small>Visible on your profile & booking page</small></label>
        <label class="pick ${s?.visibility === 'private' ? 'on' : ''}"><input type="radio" name="svVis" value="private" ${s?.visibility === 'private' ? 'checked' : ''}><b>🔒 Private</b><small>Hidden — only you can assign it</small></label>

    </div>
    <footer><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-pine" onclick="saveService('${id || ''}')">Save Service</button></footer>
  `);
  $$('#modalBox .pick input').forEach(r => r.addEventListener('change', () => { $$('#modalBox .pick').forEach(p => p.classList.remove('on')); r.closest('.pick').classList.add('on'); }));
}

async function saveService(id) {
  const name = $('#svName').value.trim();
  if (!name) return toast('Give the service a name.', 'warn');
  const data = { instructor_id: currentUser.id, name, description: $('#svDesc').value.trim(), rate: +$('#svRate').value || null, unit: $('#svUnit').value, visibility: document.querySelector('#modalBox input[name=svVis]:checked').value, updated_at: new Date().toISOString() };
  
  if (id) { delete data.instructor_id; await supabaseClient.from('services').update(data).eq('id', id).eq('instructor_id', currentUser.id); } 
  else { delete data.updated_at; await supabaseClient.from('services').insert([data]); }
  
  closeModal(); await loadServices(); renderServices(); toast('Service saved.', 'ok');
}

async function archiveService(id, shouldArchive) {
  await supabaseClient.from('services').update({ archived: shouldArchive }).eq('id', id).eq('instructor_id', currentUser.id);
  await loadServices(); renderServices(); toast(shouldArchive ? 'Service archived' : 'Service restored', 'ok');
}

async function saveProfile() {
  const I = S.instructor;
  const newName = $('#pfName').value.trim() || I.name;
  const newHandle = $('#pfHandle').value.trim().replace(/^@/, '') || I.handle;
  const newSpecs = $('#pfSpecs').value.split(',').map(s => s.trim()).filter(Boolean);
  const newBio = $('#pfBio').value.trim();
  const newSocials = $('#pfSocial').value.split('\n').map(l => { const [label, ...h] = l.split('·'); return label && h.length ? { label: label.trim(), handle: h.join('·').trim() } : null; }).filter(Boolean);

  await supabaseClient.from('profiles').update({ full_name: newName, username: newHandle, preferred_channel: newSpecs[0] }).eq('id', currentUser.id);
  await supabaseClient.from('instructor_profiles').update({ bio: newBio }).eq('id', currentUser.id);
  
  I.name = newName; I.handle = newHandle; I.specs = newSpecs; I.bio = newBio; I.socials = newSocials;
  closeModal(); renderAll(); toast('Profile updated.', 'ok');
}

}

function makeInviteCode() {
  const b = crypto.getRandomValues(new Uint8Array(6));
  const rnd = Array.from(b, x => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x % 32]).join('');
  return (S.instructor.handle || 'COACH').replace(/[^a-z0-9]/gi, '').slice(0, 4).toUpperCase() + '-' + rnd;
}
const inviteLink = code => `${window.location.origin}/auth.html?invite=${encodeURIComponent(code)}`;

async function sendClientInvite() {

  // One single-use invite locked to this email. Existing OR new accounts redeem it the same way.
  const code = makeInviteCode(), link = inviteLink(code);
  const { error } = await supabaseClient.from('client_invites').insert({
    code, instructor_id: currentUser.id, email, link, status: 'active', max_uses: 1,
    expires_at: new Date(Date.now() + 7 * 864e5).toISOString()
  });
  if (error) { console.error(error); toast('Could not create invite: ' + error.message, 'warn'); return; }
  toast('Invite ready — your email app will open', 'ok');
  window.open('mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent('Invitation to train with ' + S.instructor.name) + '&body=' + encodeURIComponent('Hi!\n\nJoin my coaching here: ' + link + '\nCode: ' + code + '\nExpires in 7 days'), '_blank');

/* ---------------- 11. GLOBAL EVENTS & DELEGATION ---------------- */
function bindGlobalEvents() {
  document.addEventListener('click', e => {
    if (!e.target.closest('.svcMenuWrap')) $$('.svcMenu.open').forEach(m => m.classList.remove('open'));
    if (!e.target.closest('.bellWrap')) $('#bellDD')?.classList.remove('open');

    const btn = e.target.closest('[data-act]');
    if (!btn) return;

    const act = btn.dataset.act;
    const id = btn.dataset.id;
    const sessId = btn.dataset.sessid;

    if (act === 'addService') openServiceForm();
    if (act === 'svcEdit') { closeModal(); openServiceForm(id); }
    if (act === 'svcArchive') archiveService(id, true);
    if (act === 'svcRestore') archiveService(id, false);
    if (act === 'svcMenu') { e.stopPropagation(); btn.nextElementSibling?.classList.toggle('open'); }
    if (act === 'assign') openAssign();
    if (act === 'editSub') openEditSubscription(id);
    if (act === 'confirm') openConfirm(id, sessId);
    if (act === 'checkin') checkIn(id);
    if (act === 'pause') pauseSub(id);
    if (act === 'resume') resumeSub(id);
    if (act === 'activate') activateSub(id);
    if (act === 'undoConfirm') openUndoConfirmModal(id, sessId);
    if (act === 'undoConfirm') openUndoConfirmModal(id, sessId);
    if (act === 'completeSub') completeSub(id);
    if (act === 'cancelSub') cancelSub(id);
    if (act === 'reactivate') reactivateSub(id);
    if (act === 'view' || act === 'openSub') openDetail(id);
    if (act === 'back') showDash();
    if (act === 'clientView') { view.clientView = !view.clientView; renderDetail(); }
    if (act === 'shareSub') { const origin = window.location.origin; const basePath = '/instructor/'; const link = `${origin}/clients/?sub=${view.subId}`; navigator.clipboard.writeText(link); toast('Subscription link copied: '+link, 'ok'); }
    if (act === 'bell') { $('#bellDD')?.classList.toggle('open'); if($('#bellDD')?.classList.contains('open')) setTimeout(() => document.addEventListener('click', closeBellOnce), 0); }
    if (act === 'copy') { navigator.clipboard.writeText(btn.dataset.copy || ''); toast('Copied to clipboard!', 'ok'); }
    if (act === 'shareProfile') openShare();
    if (act === 'referInstructor') openRefer();
    if (act === 'connectClient') openConnect();
    if (act === 'editProfile') openProfileEdit();
    if (act === 'acc') { btn.closest('.acc').classList.toggle('open'); }
  });
}

function closeBellOnce(e) {
  if (!e.target.closest('.bellWrap')) { $('#bellDD')?.classList.remove('open'); document.removeEventListener('click', closeBellOnce); }
}

/* ---------------- 12. AUTO CHECK-IN ENGINE ---------------- */

async function tick() {

  if (!currentUser) return;

  const now = new Date();
  const today = todayISO();

  const changed = [];

  for (const sub of S.subs) {

    // --------------------------------------------------------
    // Subscription expiration
    // --------------------------------------------------------
    if (
      sub.status === 'active' &&
      sub.endDate &&
      sub.endDate < today
    ) {

      const { error } =
        await supabaseClient
          .from('subscriptions')
          .update({
            status: 'expired'
          })
          .eq('id', sub.id);

      if (!error) {
        await logActivity(
          'Subscription expired — ' +
          clientName(sub) +
          ' · ' +
          serviceName(sub)
        );
      }

      continue;
    }

    // --------------------------------------------------------
    // Subscription already complete
    // --------------------------------------------------------
    if (
      sub.status === 'active' &&
      sub.totalSessions > 0 &&
      sub.completed >= sub.totalSessions
    ) {

      const { error } =
        await supabaseClient
          .from('subscriptions')
          .update({
            status: 'completed'
          })
          .eq('id', sub.id);

      if (!error) {
        await logActivity(
          'Subscription completed — ' +
          clientName(sub)
        );
      }

      continue;
    }

    // --------------------------------------------------------
    // Only active subscriptions participate in auto check-in.
    // --------------------------------------------------------
    if (
      sub.status !== 'active' ||
      !sub.auto
    ) {
      continue;
    }

    // --------------------------------------------------------
    // Find the scheduled session for TODAY.
    // --------------------------------------------------------
    const sessionToday =
      (sub.sessions || []).find(
        session =>
          session.date === today &&
          session.status === 'scheduled'
      );

    if (!sessionToday) {
      continue;
    }

    // --------------------------------------------------------
    // Don't auto check-in before scheduled time.
    // --------------------------------------------------------
    if (!sessionToday.scheduledAt) {
      continue;
    }

    if (now.getTime() < sessionToday.scheduledAt) {
      continue;
    }

    // --------------------------------------------------------
    // Check it in.
    //
    // IMPORTANT:
    // We UPDATE the scheduled session.
    // We do NOT create another session.
    // --------------------------------------------------------
    const checkinAt =
      now.toISOString();

    const { error } =
      await supabaseClient
        .from('sessions')
        .update({
          status: 'checked_in',

          checkin_at: checkinAt,

          started_at:
            sessionToday.startedAt
              ? new Date(
                  sessionToday.startedAt
                ).toISOString()
              : checkinAt,

          auto_checkin: true,

          updated_at: checkinAt
        })
        .eq('id', sessionToday.id)
        .eq('subscription_id', sub.id)
        .eq('status', 'scheduled');

    if (error) {

      console.error(
        'Auto check-in error:',
        error
      );

      continue;
    }

    await logActivity(
      'Auto check-in — ' +
      clientName(sub) +
      ' · ' +
      serviceName(sub) +
      ' (scheduled ' +
      sub.time +
      ')'
    );

    changed.push({
      name: clientName(sub),
      session: sessionToday.n
    });
  }

  // ----------------------------------------------------------
  // Refresh the UI after automatic changes.
  // ----------------------------------------------------------
  if (changed.length) {

    await loadAllDashboardData();

    changed.forEach(item => {

      toast(
        `🕘 Auto check-in — ${item.name} · session #${pad(item.session)}.`,
        'warn'
      );

    });
  }
}
/* ---------------- 13. TOAST NOTIFICATIONS ---------------- */
function toast(msg, type = 'ok') {
  const container = $('#toasts');
  if (!container) return;
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span class="tIco">${type === 'ok' ? icoCheck : '!'}</span><span>${esc(msg)}</span>`;
  container.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 3200);
}

async function actConnect(instId){
  const existing=connFor(instId);
  let error=null;
  if(existing){
    if(existing.status==='pending'){ banner('⏳','Already requested','Your connection request is awaiting approval.'); return; }
    const res=await sb.from('instructor_clients').update({status:'pending'}).eq('id',existing.id);
    error=res.error;
  } else {
    const res=await sb.from('instructor_clients')
      .insert({ instructor_id:instId, client_id:S.uid, status:'pending' });  /* 'pending' is a valid schema status — never 'connected' */
    error=res.error;
  }
  if(error){
    console.error('✗ Connection request failed:',error.message);
    banner('⚠️','Could not send request',error.message);
    return;
  }
  console.log('%c✓ Connection request sent (instructor_clients.status = pending)','color:#1E7A4F');
  banner('<svg class="hi hi-lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.392 0-4.611-.46-6.635-1.28a4.9 4.9 0 01-.028-.02 3 3 0 004.682-2.72A9.094 9.094 0 0112 18c.74 0 1.458.084 2.147.24M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>','Request sent','The instructor will approve your connection.');
  await refresh(['connections'],false);
}
async function sendMsg(them){
  const inp=$('#msgInput'); if(!inp) return;
  const text=(inp.value||'').trim(); if(!text) return;
  if(!S.msgsTable){ banner('<svg class="hi hi-lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-.476-.095 48.64 48.64 0 00-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951"/></svg>','Messaging unavailable','No messages table in this workspace yet.'); return; }
  const { error } = await sb.from('messages').insert({ sender_id:S.uid, recipient_id:them, body:text });
  if(error){ console.error('✗ Message send failed:',error.message); banner('⚠️','Could not send',error.message); return; }
  inp.value='';
  await loadThreadMessages(them);
  await loadInbox(); updateBadges();
}
async function handleAct(act,el){
  const parts=String(act).split(':');
  const k=parts[0], arg=parts.slice(1).join(':');
  if(k==='connect'){
    if(el){ el.disabled=true; const t=el.textContent; el.textContent='Sending…'; await actConnect(arg); if(cur.name!=='inst'){ el.disabled=false; el.textContent=t; } }
    else await actConnect(arg);
    return;
  }
  if(k==='signout'){
    try{ if(S.channel) await sb.removeChannel(S.channel); }catch(e){}
    try{ await sb.auth.signOut(); }catch(e){}
    window.location.replace(LOGIN_PAGE);
    return;
  }
  if(k==='markallread'){
    const s=readSet(); allNotifs().forEach(n=>s.add(n.id)); persistRead(s);
    if(cur.name==='notifs') renderNotifs();
    updateBadges();
    return;
  }
  if(k==='refresh-all'){
    banner('⟳','Refreshing','Pulling fresh data from Supabase…');
    await refresh(['profile','clientProfile','subscriptions','sessions','connections','instructors','notifs','inbox'],false);
    banner('✓','Up to date','All data layers refreshed.');
    return;
  }
  if(k==='reconnect'){
    banner('🔌','Realtime','Reconnecting to Supabase realtime…');
    await setupRealtime();
    return;
  }
  if(k==='retry'){
    const map={profile:'profile',clientProfile:'clientProfile',subscriptions:'subscriptions',sessions:'sessions',
      connections:'connections',instructors:'instructors',instructorProfiles:'instructors',services:'instructors',
      notifs:'notifs',inbox:'inbox'};
    await refresh([map[arg]||'subscriptions'],false);
    return;
  }
  if(k==='explore-clear'){
    exploreQ='';
    const q=$('#exploreQ'); if(q) q.value='';
    updateExploreResults();
    return;
  }
}

    return;
  }
  const inst=S.instructors.get(s.instructor_id);
  const svc=S.servicesById.get(s.service_id);
  const sess=S.sessions.filter(x=>x.subscription_id===s.id);
  const realDone = (typeof realCompletedForSub==='function'?realCompletedForSub(s.id):0) || s.completed_sessions || 0;
  const upcoming=sess.filter(x=>['scheduled','checked_in'].includes(x.status))
    .sort((a,b)=> ts(a.scheduled_at)-ts(b.scheduled_at));
  const past=sess.filter(x=>!['scheduled','checked_in'].includes(x.status))
    .sort((a,b)=>(b.session_number||0)-(a.session_number||0));
  const rem=Math.max(0,(s.total_sessions||0)-realDone);

  /* ▼ NEW — session progress ring (same circular counter as instructor console) */
  const total=s.total_sessions||0;
  const pct=total? Math.min(100,Math.round(realDone/total*100)) : 0;
  const RC=2*Math.PI*90;
  const doneOff=RC-(pct/100)*RC;
  const pendOff=RC-((100-pct)/100)*RC;
  const ringHtml=
    '<div class="paycard rise" style="margin-bottom:14px">'
    +'<div class="block-title" style="margin:0 0 6px">Session progress <small>'+rem+' left</small></div>'
    +'<div class="ringWrap" role="img" aria-label="'+pct+'% of sessions completed">'
    +  '<svg viewBox="0 0 210 210">'
    +    '<defs><linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">'
    +      '<stop offset="0%" stop-color="#1E7A4F"/><stop offset="100%" stop-color="#B8D93F"/>'
    +    '</linearGradient></defs>'
    +    '<circle cx="105" cy="105" r="90" fill="none" stroke="#E3EAD8" stroke-width="16"/>'
    +    '<circle class="arcPend" cx="105" cy="105" r="90" fill="none" stroke="#EFA51C" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+RC+'" stroke-dashoffset="'+pendOff+'" transform="rotate(-90 105 105)"/>'
    +    '<circle class="arcDone" cx="105" cy="105" r="90" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+RC+'" stroke-dashoffset="'+doneOff+'" transform="rotate(-90 105 105)"/>'
    +  '</svg>'
    +  '<div class="ringCenter">'
    +    '<span class="pc">'+pct+'%</span>'
    +    '<span class="of">'+realDone+' of '+total+' sessions</span>'
    +    (total===0
        ? '<span class="rem">No sessions yet</span>'
        : rem===0
          ? '<span class="rem" style="color:var(--pine-700);background:var(--lime-soft)">Complete ✓</span>'
          : '<span class="rem">'+rem+' left</span>')
    +  '</div>'
    +'</div>'
    +'<div class="ringLegend">'
    +  '<span><i style="background:var(--leaf)"></i>Completed</span>'
    +  '<span><i style="background:var(--gold)"></i>Upcoming</span>'
    +'</div>'
    +'</div>';
  /* ▲ NEW */

  const upHtml=upcoming.length? upcoming.map(x=>{
    const d=toDate(x.scheduled_at);
    const overdue=d && d.getTime()<Date.now();
    return '<div class="srow'+(overdue?' overdue':'')+'">'
      +'<div class="sdate">'+(d?DAYS[d.getDay()]:'—')+'<small>'+(d?MONS[d.getMonth()]+' '+d.getDate():'TBD')+'</small></div>'
      +'<div class="snote"><b>Session '+(x.session_number||'—')+' · '+(d?esc(fmtTime(x.scheduled_at)):'time TBC')+'</b>'
      +'<small>'+(x.checkin_at? 'Checked in '+esc(fmtTime(x.checkin_at)) : (x.note? esc(x.note) : esc(svc?svc.name:'Training program')))+'</small></div>'
      +sessChip(x.status)
      +'</div>';
  }).join('') : '<div class="msgnote">NO UPCOMING SESSIONS SCHEDULED</div>';

  const pastHtml=past.length? past.map(x=>{
    const dt=toDate(x.completed_at||x.started_at||x.checkin_at||x.scheduled_at||x.updated_at);
    const cls=['confirmed','completed'].includes(x.status)? 'var(--leaf)' : (x.status==='missed'? 'var(--amber)':'var(--coral)');
    const lbl=['confirmed','completed'].includes(x.status)? 'DONE' : (x.status==='missed'? 'MISSED':'VOID');
    return '<div class="srow">'
      +'<div class="sdate">'+(dt?DAYS[dt.getDay()]:'—')+'<small>'+(dt?MONS[dt.getMonth()]+' '+dt.getDate():'—')+'</small></div>'
      +'<div class="snote"><b>Session '+(x.session_number||'—')+'</b>'+(x.note?('<small>'+esc(x.note)+'</small>'):'')+'</div>'
      +'<div class="stamp" style="--sc:'+cls+'"><b>'+lbl+'</b><span>SESSION</span></div>'
      +'</div>';
  }).join('') : '';

  const ev=[];
  if(s.created_at) ev.push({d:toDate(s.created_at),x:'Enrolled in '+svcNameOfSub(s)});
  if(s.start_date) ev.push({d:toDate(s.start_date),x:'Program started'});
  sess.filter(x=>['confirmed','completed'].includes(x.status)).forEach(x=>{
    const d=toDate(x.completed_at||x.updated_at||x.scheduled_at);
    if(d) ev.push({d:d,x:'Session '+(x.session_number||'—')+' completed'+(x.note?' — \u201C'+x.note+'\u201D':'')});
  });
  if(s.paused_at) ev.push({d:toDate(s.paused_at),x:'Program paused'});
  if(['completed','cancelled','expired'].includes(s.status)&&s.updated_at) ev.push({d:toDate(s.updated_at),x:'Program '+s.status});
  ev.sort((a,b)=> (b.d?b.d.getTime():0)-(a.d?a.d.getTime():0));
  const tlHtml=ev.length? ev.slice(0,14).map(e=>'<div class="tl"><small>'+esc(fmtDate(e.d).toUpperCase())+'</small>'+esc(e.x)+'</div>').join('')
    : '<div class="msgnote">NO HISTORY YET</div>';

  const noteLines=notesLines(s.notes);

  $('#v-sub').innerHTML=
    backbar(svc?svc.name:'Subscription')
    +errbarHtml('subscriptions','sessions')
    +'<div class="eyebrow">SUBSCRIPTION</div>'
    +'<h1 class="greet">'+esc(svc?svc.name:'Training program')+'</h1>'
    +'<p class="greet-sub">'+esc(billingTag(s)).toUpperCase()+' · '+esc(inst?inst.full_name:'INSTRUCTOR').toUpperCase()+' · '+String(s.status||'').toUpperCase()+'</p>'
    +'<div class="detail-grid">'
    +'<div>'
    +  '<button class="instchip rise" data-go="inst:'+s.instructor_id+'">'
    +    '<span class="mini-av avwrap" style="background:'+tileColor(s.instructor_id)+'">'+avHtml(inst&&inst.avatar_url,inst?inst.full_name:'?')+'</span>'
    +    '<span style="flex:1"><b>'+esc(inst?inst.full_name:'Your instructor')+'</b><small>'+(inst&&inst.location?esc(inst.location):'View instructor profile →')+'</small></span>'
    +    '<span class="chev" style="color:#B7C6AD">›</span>'
    +  '</button>'
    +  ringHtml
    +  '<div class="block-title">Upcoming sessions <small>'+upcoming.length+'</small></div>'
    +  upHtml
    +(pastHtml? ('<div class="block-title">Session history <small>'+past.length+'</small></div>'+pastHtml) : '')
    +'</div>'
    +'<div>'
    +  '<div class="paycard">'
    +    '<div class="payrow"><span>Rate</span><b>'+(fmtMoney(s.rate)||'Arranged with instructor')+'</b></div>'
    +    '<div class="payrow"><span>Billing</span><b>'+esc(s.billing_type||'—')+'</b></div>'
    +    '<div class="payrow"><span>Sessions</span><b>'+realDone+' of '+(s.total_sessions||0)+' · '+rem+' left</b></div>'
    +    '<div class="payrow"><span>Payment</span><b>'+payChip(s.payment_status)+'</b></div>'
    +    '<div class="payrow"><span>Status</span><b>'+subStatusChip(s.status)+'</b></div>'
    +    '<div class="payrow"><span>Starts</span><b>'+(s.start_date?esc(fmtDate(s.start_date)):'—')+'</b></div>'
    +(s.end_date? ('<div class="payrow"><span>Ends</span><b>'+esc(fmtDate(s.end_date))+'</b></div>') : '')
    +(s.session_time? ('<div class="payrow"><span>Usual time</span><b>'+esc(fmtTimeOnly(s.session_time))+'</b></div>') : '')
    +    '<div class="payrow"><span>Instructor</span><b>'+esc(inst?inst.full_name:'—')+'</b></div>'
    +(s.auto_checkin? '<div class="payrow"><span>Auto check-in</span><b>Enabled</b></div>' : '')
    +  '</div>'
    +(noteLines.length? ('<div class="block-title">Notes</div>'+noteLines.map(n=>'<div class="ibio" style="margin-bottom:8px;padding:12px 14px;font-size:13px">'+esc(n)+'</div>').join('')) : '')
    +  '<div class="block-title">Timeline</div>'
    +  '<div class="timeline">'+tlHtml+'</div>'
    +'</div>'
    +'</div>';
}

/* ---------- 02 / EXPLORE ---------- */
function exploreMatches(){
  const q=exploreQ.trim().toLowerCase();
  let list=[...S.instructors.values()];
  if(q) list=list.filter(i=>
    [i.full_name,i.username,i.location,i.bio].filter(Boolean).some(v=>String(v).toLowerCase().includes(q))
    || (i.services||[]).some(s=>String(s.name||'').toLowerCase().includes(q)));
  return list.sort((a,b)=>
    ((b.isConnected?1:0)-(a.isConnected?1:0)) || String(a.full_name).localeCompare(String(b.full_name)));
}
function exploreCard(i,idx){
  const conn=i.connection;
  const badge=conn?
    (conn.status==='active'? '<span class="nconn">CONNECTED ✓</span>'
      : (conn.status==='pending'||conn.status==='paused')? '<span class="nconn pend">'+esc(connLabel(conn.status))+'</span>'
      : '') : '';
  return '<button class="ncard rise" style="animation-delay:'+(idx*0.04).toFixed(2)+'s" data-go="inst:'+i.id+'">'
    +badge
    +'<span class="nav-emoji avwrap" style="background:'+tileColor(i.id)+'">'+avHtml(i.avatar_url,i.full_name)+'</span>'
    +'<b>'+esc(i.full_name)+'</b>'
    +'<small>'+(i.username?'@'+esc(i.username):'')+(i.location?((i.username?' · ':'')+esc(i.location)):'')+'</small>'
    +(i.bio?('<p class="nbio">'+esc(i.bio)+'</p>'):'')
    +'<span class="nmeta">'+esc(exploreMeta(i))+'</span>'
    +'</button>';
}
function renderExplore(){
  $('#v-explore').innerHTML=
    errbarHtml('instructors','instructorProfiles','services')
    +'<div class="eyebrow">02 / EXPLORE INSTRUCTORS</div>'

    +'<p class="greet-sub">REAL INSTRUCTORS · LIVE FROM YOUR SUPABASE WORKSPACE</p>'

function updateExploreResults(){
  const res=$('#exploreResults'); if(!res) return;
  const list=exploreMatches();
  const cnt=$('#exploreCount'); if(cnt) cnt.textContent=list.length+' SHOWN';
  res.innerHTML=list.length
    ? '<div class="grid-cards">'+list.map((i,idx)=>exploreCard(i,idx)).join('')+'</div>'
    : (S.instructors.size
      ? emptyHtml('<svg class="hi hi-lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>','No matches','No instructors match \u201C'+exploreQ+'\u201D. Try a different name, location or service.','Clear search','data-act="explore-clear"')
      : emptyHtml('🧭','No instructors yet','No instructor profiles are visible to you right now. This may mean none exist yet, or Row Level Security restricts the profiles table.','⟳ Refresh data','data-act="refresh-all"'));

  const listings=$('#exploreListings'); if(!listings) return;
  const svcList=[];
  S.instructors.forEach(i=>{ (i.services||[]).forEach(sv=>{ if(!sv.archived && sv.visibility!=='private') svcList.push({s:sv,i:i}); }); });
  svcList.sort((a,b)=> ts(b.s.created_at)-ts(a.s.created_at));
  if(svcList.length){
    listings.innerHTML='<div class="block-title">Latest listings <small>FROM SERVICES TABLE</small></div>'
      +'<div class="grid-pop">'+svcList.slice(0,6).map(({s,i})=>
        '<button class="poprow" data-go="inst:'+i.id+'">'
        +'<span class="pe" style="background:'+tileColor(s.id)+';color:#fff">'+esc(initials(s.name))+'</span>'
        +'<div style="flex:1"><b>'+esc(s.name)+'</b><small>'+esc(i.full_name)+(i.location?' · '+esc(i.location):'')+'</small></div>'
        +'<span class="pr">'+(s.rate!=null? esc(fmtMoney(s.rate)+(s.unit?' '+esc(s.unit):'')) : 'Ask for pricing')+'</span>'
        +'<span class="go">›</span>'
        +'</button>').join('')+'</div>';
  } else listings.innerHTML='';
}

  } else if(conn.status==='paused'){
    connHtml='<div class="connbox wait">⏸ Connection paused'
      +'<small class="chint">'+first+' has paused this connection. Your history stays visible.</small></div>';
  } else {
    connHtml='<div class="connbox stop">Connection ended'
      +'<small class="chint">You can request to connect again at any time.</small>'
      +'<button class="btn lime" data-act="connect:'+i.id+'">Connect again</button></div>';

  $('#v-inst').innerHTML=

    +  '</div>'
    +  '<div class="imeta">'
    +(i.location?('<span>📍 '+esc(i.location)+'</span>'):'')
    +(i.phone?('<span>📞 '+esc(i.phone)+'</span>'):'')
    +    '<span>📋 '+vis.length+' service'+(vis.length===1?'':'s')+'</span>'
    +    '<span>'+(i.accepting_clients===false?'🚫 Not accepting clients':'✓ Accepting clients')+'</span>'

async function saveProfileEdits(){
  const btn=$('#saveProfileBtn');
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  const updates={
    full_name: ($('#edit_full_name')?.value||'').trim() || null,
    username: ($('#edit_username')?.value||'').trim() || null,
    phone: ($('#edit_phone')?.value||'').trim() || null,
    location: ($('#edit_location')?.value||'').trim() || null,
    avatar_url: ($('#edit_avatar_url')?.value||'').trim() || null,
    bio: ($('#edit_bio')?.value||'').trim() || null,
    updated_at: new Date().toISOString()
  };
  // remove empty
  Object.keys(updates).forEach(k=>{ if(updates[k]==='' ) updates[k]=null; });
  try{
    const { error } = await sb.from('profiles').update(updates).eq('id', S.uid);
    if(error) throw error;
    // also try client_profiles for experience/goal if present
    try{
      const cpUpdates={};
      const exp=$('#edit_experience')?.value;
      const goal=$('#edit_goal')?.value;
      if(exp!==undefined) cpUpdates.experience_level=exp||null;
      if(goal!==undefined) cpUpdates.primary_goal=goal||null;
      if(Object.keys(cpUpdates).length){
        cpUpdates.updated_at=new Date().toISOString();
        const { error: e2 } = await sb.from('client_profiles').upsert({ id: S.uid, ...cpUpdates }, { onConflict:'id' });
        if(e2) console.warn('client_profiles upsert failed', e2.message);
      }
    }catch(e){}
    S.profile={...(S.profile||{}), ...updates};
    profileEditMode=false;
    banner('✅','Profile updated','Your changes are live');
    renderProfile();
  }catch(err){
    console.error('save profile failed', err);
    banner('⚠️','Could not save profile', err.message||String(err));
    if(btn){ btn.disabled=false; btn.textContent='Save changes'; }
  }
}

function waNumberForInstructor(id){
  try{
    if(id){
      const inst=S.instructors.get(id);
      if(inst) return inst.whatsapp || inst.whatsapp_number || inst.phone || inst.phone_number || inst.whatsapp_link || null;
    }
    // fallback to first active connection's instructor
    for(const c of (S.connections||[])){
      if(c.status==='active'){
        const inst=S.instructors.get(c.instructor_id);
        if(inst && (inst.whatsapp||inst.phone||inst.whatsapp_number||inst.phone_number)) return inst.whatsapp||inst.whatsapp_number||inst.phone||inst.phone_number;
      }
    }
    // any instructor
    for(const inst of S.instructors.values()){
      if(inst.whatsapp||inst.phone||inst.whatsapp_number||inst.phone_number) return inst.whatsapp||inst.whatsapp_number||inst.phone||inst.phone_number;
    }
  }catch(e){}
  return null;
}
function cleanWaNumber(raw){
  if(!raw) return null;
  let s=String(raw).replace(/[^0-9]/g,'');
  if(!s) return null;
  if(s.startsWith('0') && s.length>=10){ s='234'+s.slice(1); }
  if(s.length===10) s='234'+s;
  return s;
}

function setBoot(msg){ const el=$('#bootMsg'); if(el) el.textContent=msg; }
function hideBoot(){ const b=$('#boot'); if(b) b.remove(); }
function bootFail(title,msg){
  const b=$('#boot'); if(!b){ console.error(title,msg); return; }
  b.innerHTML='<div class="bin"><div class="ring" style="display:none"></div>'
    +'<b>'+esc(title)+'</b>'
    +'<small style="text-transform:none;letter-spacing:.04em;line-height:1.7;color:#AECBB8">'+esc(msg)+'</small>'
    +'<button class="btn lime" onclick="location.reload()">Reload</button></div>';
}
async function init(){
  try{
    if(typeof supabase==='undefined'||!supabase.createClient){
      bootFail('SDK failed to load','The Supabase JS SDK could not be loaded from the CDN. Check your connection and reload.');
      return;
    }
    if(!SUPABASE_URL||!SUPABASE_ANON_KEY||/YOUR_/.test(SUPABASE_URL+SUPABASE_ANON_KEY)){
      bootFail('Configuration missing','Open this file and set SUPABASE_URL and SUPABASE_ANON_KEY (the public anon key only) in the CONFIG block at the top of the script. Copy them from your existing production clients.html.');
      return;
    }
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

    setBoot('Authenticating…');
    const { data:{session}, error } = await sb.auth.getSession();
    if(error) throw error;
    if(!session||!session.user){ window.location.replace(LOGIN_PAGE); return; }
    S.uid=session.user.id;
    S.email=session.user.email||'';
    diag(true,'Auth user',S.email||S.uid);

    sb.auth.onAuthStateChange(ev=>{
      if(ev==='SIGNED_OUT'){
        try{ if(S.channel) sb.removeChannel(S.channel); }catch(e){}
        window.location.replace(LOGIN_PAGE);
      }
    });

    setBoot('Loading your profile…');
    await loadProfile();
    if(!S.profile) console.warn('! No profiles row for this user — rendering with fallback identity');

    setBoot('Loading programs & sessions…');
    await Promise.all([loadClientProfile(),loadSubscriptions(),loadSessions(),loadConnections()]);
    reconcileClientCompleted();

    setBoot('Loading instructors…');
    await loadInstructors();

    setBoot('Loading notifications…');
    await Promise.all([probeMessages(),loadStoredNotifications(),loadInbox()]);

    setupRealtime();

    S.ready=true;
    S.lastSync=new Date();
    try{ const u=new URL(SUPABASE_URL); const w=$('#wsUrl'); if(w) w.textContent=u.host; }catch(e){}
    const usr=$('#wsUser'); if(usr) usr.textContent=S.email||S.uid;

    console.log('%cCoachDeck client passport — data layer ready','color:#D6F45A;font-weight:700');
    hideBoot();
    updateBadges();
    // Handle production share links: ?coach=, ?instructor=, ?sub=, ?invite=, ?ref=
    try{
      const params = new URLSearchParams(window.location.search);
      const coachParam = params.get('coach') || params.get('instructor') || params.get('c');
      const subParam = params.get('sub') || params.get('subscription');
      const inviteCode = params.get('invite');
      const instructorId = params.get('instructor_id') || params.get('instructor');
      const ref = params.get('ref');

      if(inviteCode && instructorId){
        // Auto-connect flow for client invite
        localStorage.setItem('pending_invite', JSON.stringify({ code: inviteCode, instructor_id: instructorId, at: new Date().toISOString() }));
        // Try to auto-create connection if already logged in
        setTimeout(async ()=>{
          try{
            const { data: existing } = await sb.from('instructor_clients').select('id').eq('instructor_id', instructorId).eq('client_id', S.uid).maybeSingle();
            if(!existing){
              await sb.from('instructor_clients').insert({ instructor_id: instructorId, client_id: S.uid, status: 'pending', invite_code: inviteCode });
              banner('<svg class="hi hi-lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.392 0-4.611-.46-6.635-1.28a4.9 4.9 0 01-.028-.02 3 3 0 004.682-2.72A9.094 9.094 0 0112 18c.74 0 1.458.084 2.147.24M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>','Invite accepted','You are now connected to your coach — pending approval');
              await loadConnections(); await loadInstructors(); updateBadges(); show('myinst', null, true);
            } else {
              show('myinst', null, true);
            }
          }catch(e){ console.warn('invite auto-connect failed', e); show('subs',null,true); }
        }, 800);
      } else if(coachParam){
        // Open instructor profile by handle or id
        const found = [...S.instructors.values()].find(i=> i.id===coachParam || i.username===coachParam || (i.full_name&&i.full_name.toLowerCase().replace(/\s+/g,'-')===coachParam.toLowerCase()));
        if(found){ show('inst', found.id, true); }
        else {
          // If not in list yet, try fetch directly
          show('explore', null, true);
          exploreQ = coachParam; setTimeout(()=>updateExploreResults(), 300);
        }
      } else if(subParam){
        show('sub', subParam, true);
      } else if(ref){
        show('subs',null,true);
      } else {
        show('subs',null,true);
      }
    }catch(e){ show('subs',null,true); }

  }catch(err){
    console.error('✗ Boot failed:',err);
    bootFail('Could not start',(err&&err.message)?err.message:String(err));
  }
}

/* ============================================================
   EVENT WIRING
============================================================ */
document.addEventListener('click', async e=>{
  const nt=e.target.closest('[data-notif]');
  if(nt){ markRead(nt.dataset.notif); if(!nt.dataset.go&&cur.name==='notifs') renderNotifs(); }

  const go=e.target.closest('[data-go]');
  if(go){
    if(go.tagName==='A') e.preventDefault();
    const parts=go.dataset.go.split(':');
    show(parts[0],parts.slice(1).join(':')||null);
    return;
  }
  const back=e.target.closest('[data-back]');
  if(back){ goBack(); return; }
  const rail=e.target.closest('[data-rail]');
  if(rail){ show(rail.dataset.rail); return; }
  const tab=e.target.closest('[data-tab]');
  if(tab){ show(tab.dataset.tab); return; }
  const act=e.target.closest('[data-act]');
  if(act){ handleAct(act.dataset.act,act); return; }
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='exploreQ'){ exploreQ=e.target.value; updateExploreResults(); }
});
function closeDrawer(){ const d=$('#drawer'),s=$('#scrim'); if(d) d.classList.remove('open'); if(s) s.classList.remove('open'); }
const fabEl=$('#fab'); if(fabEl) fabEl.onclick=()=>{ renderSyncMonitor(); const d=$('#drawer'),s=$('#scrim'); if(d) d.classList.add('open'); if(s) s.classList.add('open'); };
const dx=$('#drawerX'); if(dx) dx.onclick=closeDrawer;
const sc=$('#scrim'); if(sc) sc.onclick=closeDrawer;
const bell=$('#btnBell'); if(bell) bell.onclick=()=>show('notifs');
const msgsBtn=$('#btnMsgs'); if(msgsBtn) msgsBtn.onclick=()=>show('msgs');
const avBtn=$('#btnAv'); if(avBtn) avBtn.onclick=()=>show('profile');
window.addEventListener('beforeunload',()=>{ try{ if(sb&&S.channel) sb.removeChannel(S.channel); }catch(e){} });

tick(); setInterval(tick,20000);
init();
</script>
